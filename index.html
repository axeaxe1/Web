<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Vídeo Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Rellena toda la pantalla */
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <!-- El vídeo arranca en silencio y en autoplay para cumplir las normas del navegador -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source id="videoSource" src="VID-20260812-WA0001.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>

  <script>
    const video = document.getElementById('bgVideo');
    const source = document.getElementById('videoSource');

    // Archivos de vídeo
    const videoVertical = 'VID-20260812-WA0001.mp4';
    const videoHorizontal = 'VID-20260812-WA0001.mp4';

    // Función para detectar la orientación
    function updateVideoSource() {
      const isPortrait = window.innerHeight > window.innerWidth;
      const targetVideo = isPortrait ? videoVertical : videoHorizontal;

      if (!source.src.endsWith(targetVideo)) {
        source.src = targetVideo;
        video.load();
        video.play();
      }
    }

    window.addEventListener('load', updateVideoSource);
    window.addEventListener('resize', updateVideoSource);
  </script>

</body>
</html>
