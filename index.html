<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Vídeo Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Asegura que rellene toda la pantalla */
      position: fixed;
      top: 0;
      left: 0;
    }
    /* Botón flotante para activar/desactivar el sonido */
    .btn-sound {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 18px;
      border-radius: 30px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s ease;
    }
    .btn-sound:hover {
      background: rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- El vídeo arranca en silencio y en autoplay para cumplir las normas del navegador -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source id="videoSource" src="VID-20260812-WA0001.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>

  <!-- Botón para activar el audio -->
  <button id="soundBtn" class="btn-sound">🔊 Activar sonido</button>

  <script>
    const video = document.getElementById('bgVideo');
    const source = document.getElementById('videoSource');
    const soundBtn = document.getElementById('soundBtn');

    // Nombres de tus archivos de vídeo en el repositorio
    const videoVertical = 'VID-20260812-WA0001.mp4';
    const videoHorizontal = 'VID-20260812-WA0001.mp4';

    // Función para detectar la orientación y cambiar el vídeo si es necesario
    function updateVideoSource() {
      const isPortrait = window.innerHeight > window.innerWidth;
      const targetVideo = isPortrait ? videoVertical : videoHorizontal;

      // Si el vídeo que se debe cargar es diferente al actual
      if (!source.src.endsWith(targetVideo)) {
        source.src = targetVideo;
        video.load();
        video.play();
      }
    }

    // Comprobar orientación al cargar la página y al redimensionar/girar la pantalla
    window.addEventListener('load', updateVideoSource);
    window.addEventListener('resize', updateVideoSource);

    // Alternar sonido con el botón
    soundBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = '🔇 Silenciar';
      } else {
        video.muted = true;
        soundBtn.textContent = '🔊 Activar sonido';
      }
    });
  </script>

</body>
</html>
