<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Vídeo Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Rellena toda la pantalla */
      position: fixed;
      top: 0;
      left: 0;
    }
    /* Botón flotante discreto para el sonido */
    .btn-sound {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25); /* Muy transparente */
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6; /* Transparencia general */
      transition: all 0.3s ease;
    }
    /* Al pasar el ratón o pulsar se hace un poco más visible */
    .btn-sound:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.5);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- El vídeo arranca en silencio y en autoplay para cumplir las normas del navegador -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source id="videoSource" src="VID-20260812-WA0001.mp4" type="video/mp4">
    Tu navegador no soporta reproducción de vídeo.
  </video>

  <!-- Botón icono minimalista -->
  <button id="soundBtn" class="btn-sound" aria-label="Activar sonido">🔇</button>

  <script>
    const video = document.getElementById('bgVideo');
    const source = document.getElementById('videoSource');
    const soundBtn = document.getElementById('soundBtn');

    // Archivos de vídeo
    const videoVertical = 'VID-20260812-WA0001.mp4';
    const videoHorizontal = 'VID-20260812-WA0001.mp4';

    // Función para detectar la orientación
    function updateVideoSource() {
      const isPortrait = window.innerHeight > window.innerWidth;
      const targetVideo = isPortrait ? videoVertical : videoHorizontal;

      if (!source.src.endsWith(targetVideo)) {
        source.src = targetVideo;
        video.load();
        video.play();
      }
    }

    window.addEventListener('load', updateVideoSource);
    window.addEventListener('resize', updateVideoSource);

    // Alternar sonido y cambiar el icono
    soundBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = '🔊';
        soundBtn.setAttribute('aria-label', 'Silenciar');
      } else {
        video.muted = true;
        soundBtn.textContent = '🔇';
        soundBtn.setAttribute('aria-label', 'Activar sonido');
      }
    });
  </script>

</body>
</html>
